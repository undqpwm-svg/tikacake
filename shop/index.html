<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Tika Cake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Marck+Script&display=swap">
<style>
/* Приложение кондитерской: мягкая сиренево-розовая заливка сверху, сторис, карусель акций, фото на всю карточку. */
:root{
  color-scheme:light;
  --bg:#fffdfe; --card:#ffffff; --soft:#f8f3fd; --line:#efe6f8;
  --fg:#33283f; --muted:#958aa2; --accent:#9b5fd8; --accent-2:#ef7ba7; --accent-ink:#ffffff;
  --accent-soft:#f4ebfd; --pink-soft:#fdeef4; --plum:#6b3fa0; --ok:#2f9466; --warn:#e0572f; --wa:#25d366;
  --grad:linear-gradient(135deg,#b07ce8 0%,#d97fc8 55%,#f08bb4 100%);
  --t-lilac:#f5effd; --t-pink:#fdf0f4; --t-peach:#fef4ea; --t-mint:#f2f7ea; --t-cream:#fcf7ec; --t-choc:#f8f1ec;
  --shadow:0 14px 34px -14px rgba(120,70,170,.35); --shadow-s:0 3px 14px rgba(120,70,170,.08);
  --display:"Unbounded","Montserrat",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font:"Montserrat",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --script:"Marck Script","Segoe Script","Brush Script MT",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:radial-gradient(110% 340px at 0% 0%,#f1e4ff 0%,rgba(241,228,255,0) 70%),radial-gradient(90% 300px at 100% 0%,#ffe6f1 0%,rgba(255,230,241,0) 70%),var(--bg)}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.t-lilac{background:var(--t-lilac)}.t-pink{background:var(--t-pink)}.t-peach{background:var(--t-peach)}
.t-mint{background:var(--t-mint)}.t-cream{background:var(--t-cream)}.t-choc{background:var(--t-choc)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
#view > *{animation:rise .35s ease-out both}
#view > *:nth-child(2){animation-delay:.03s}#view > *:nth-child(3){animation-delay:.06s}#view > *:nth-child(4){animation-delay:.09s}
@media (prefers-reduced-motion:reduce){#view > *{animation:none}}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,253,254,.78);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);
  display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:62px}
.hello{display:flex;flex-direction:column;line-height:1.1;min-width:0;flex:1}
.hello span{font-size:12px;color:var(--muted);font-weight:500}
.wordmark{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.05em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top h1{font-family:var(--display);font-size:17px;margin:0;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow-s);flex:none;position:relative;color:var(--fg)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .badge{top:-4px;left:auto;right:-4px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;font-family:var(--display);font-weight:600;font-size:15px;display:grid;place-items:center;flex:none;box-shadow:var(--shadow-s)}
.proto{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--card);border:1px solid var(--line);padding:5px 8px;border-radius:99px;flex:none}

main{flex:1;padding:4px 16px 150px;display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-family:var(--display);font-size:17px;margin:0;font-weight:600;text-wrap:balance}
.sec-h button{color:var(--accent);font-weight:600;font-size:13px;display:flex;align-items:center;gap:2px}
.where{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--card);border-radius:99px;padding:8px 14px 8px 10px;box-shadow:var(--shadow-s);align-self:flex-start;max-width:100%}
.where i{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.where i svg{width:15px;height:15px}
.where span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.where small{color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px}

/* Поиск */
.search{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow-s);border-radius:18px;padding:0 6px 0 16px;height:52px;border:1px solid var(--line)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.search input::placeholder{color:var(--muted)}
.search > svg{width:19px;height:19px;color:var(--accent);flex:none}
.search .filt{width:40px;height:40px;border-radius:13px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.search .filt svg{width:18px;height:18px}

/* Сторис */
.stories{display:flex;gap:14px;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.story .ring{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#b07ce8,#f08bb4,#ffc38a,#b07ce8)}
.story.seen .ring{background:var(--line)}
.story .ring i{display:block;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);overflow:hidden;position:relative;background:var(--soft)}
.story .ring svg{width:100%;height:100%}

/* Карусель акций */
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;scroll-padding-inline:16px}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;border-radius:28px;padding:20px 18px;min-height:196px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:center;text-align:left;color:#fff;box-shadow:var(--shadow)}
.slide.s1{background:linear-gradient(140deg,#a774e2 0%,#c98be0 60%,#e9a6d3 100%)}
.slide.s2{background:linear-gradient(140deg,#ee7fa9 0%,#f39ab7 55%,#fbbfa6 100%)}
.slide.s3{background:linear-gradient(140deg,#f2a874 0%,#f5b98a 55%,#f7c9a8 100%)}
.slide::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1.4px,transparent 1.6px);background-size:16px 16px;opacity:.45;-webkit-mask:linear-gradient(90deg,transparent 30%,#000 100%);mask:linear-gradient(90deg,transparent 30%,#000 100%)}
.slide > *{position:relative}
.slide .ey{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.slide h2{font-family:var(--display);font-size:19px;line-height:1.12;margin:6px 0 6px;font-weight:700;text-wrap:balance}
.slide p{margin:0 0 12px;font-size:12.5px;line-height:1.35;opacity:.95}
.slide .cta{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--plum);font-weight:700;font-size:13px;padding:9px 14px;border-radius:13px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.slide .orb{width:128px;height:128px;border-radius:50%;border:5px solid rgba(255,255,255,.75);overflow:hidden;position:relative;background:rgba(255,255,255,.3);box-shadow:0 18px 30px -14px rgba(60,20,90,.55)}
.slide .orb svg{width:100%;height:100%}
.slide .chip-p{position:absolute;right:6px;bottom:12px;background:#fff;color:var(--plum);font-family:var(--display);font-weight:600;font-size:12px;padding:6px 10px;border-radius:99px;box-shadow:var(--shadow-s)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:-14px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:20px;background:var(--accent)}

/* Мини-карта скидки */
.mycard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 14px 14px 16px;box-shadow:var(--shadow-s);border:1px solid var(--line);text-align:left;width:100%}
.mycard .pc{font-family:var(--display);font-weight:700;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.mycard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.mycard .tx b{color:var(--fg);font-size:13.5px}
.mycard .bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.mycard .bar i{display:block;height:100%;border-radius:3px;background:var(--grad)}
.mycard .go{width:34px;height:34px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}

/* Категории */
.cats{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 5px;box-shadow:var(--shadow-s)}
.cat i{width:38px;height:38px;border-radius:50%;overflow:hidden;position:relative;display:block;flex:none}
.cat i svg{width:100%;height:100%}

/* Карточки товаров */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.card{display:flex;flex-direction:column;gap:7px;text-align:left;cursor:pointer;min-width:0}
.pic{aspect-ratio:1/1;border-radius:24px;display:grid;place-items:center;position:relative;max-width:100%;overflow:hidden;box-shadow:var(--shadow-s)}
.pic svg{width:96%;height:auto}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;opacity:0;transition:opacity .35s ease,transform .5s ease}
.photo.ok{opacity:1}
.skel{position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 70%) 0 0/200% 100% no-repeat;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.photo{transition:none}}
.card:hover .photo{transform:scale(1.04)}
.tag{position:absolute;top:10px;left:10px;z-index:1;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--grad);color:#fff;box-shadow:0 4px 12px -4px rgba(200,90,160,.6)}
.fav{position:absolute;top:8px;right:8px;z-index:1;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow-s)}
.fav svg{width:17px;height:17px}
.fav.on{color:var(--accent-2)}
.fav.on svg{fill:currentColor;animation:pop .35s}
.card .nm{font-weight:600;font-size:14px;line-height:1.25;padding-inline:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .wt{font-size:11.5px;color:var(--muted);padding-inline:2px;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-inline:2px;margin-top:auto}
.price{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.price .from{font-family:var(--font);font-weight:500;color:var(--muted);font-size:11.5px}
.add{width:38px;height:38px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 16px -8px rgba(170,90,200,.9)}
.add svg{width:18px;height:18px}
.add.in{background:var(--accent-soft);color:var(--accent);box-shadow:none;width:auto;padding:0 12px;font-weight:700;font-size:13px}
.step{display:flex;align-items:center;background:var(--accent-soft);border-radius:14px;height:38px;flex:none}
.step button{width:30px;height:100%;color:var(--accent);font-size:18px;font-weight:700}
.step span{min-width:16px;text-align:center;font-weight:700;font-size:13px;color:var(--plum);font-variant-numeric:tabular-nums}

/* Широкие карточки (сеты) */
.hscroll{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.wide{flex:0 0 82%;scroll-snap-align:start;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:8px;box-shadow:var(--shadow-s);border:1px solid var(--line);text-align:left;cursor:pointer}
.wide .pic{border-radius:16px;box-shadow:none}
.wide .nm{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wide .ds{font-size:11.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 8px}
.wide .row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-right:4px}

/* Баннер со слоганом */
.slogan{border-radius:28px;padding:22px 18px 18px;background:linear-gradient(160deg,#fff7ef 0%,#ffeef5 100%);border:1px solid #fbe3ea;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.slogan .sc{font-family:var(--script);font-size:38px;line-height:.95;color:var(--accent-2);transform:rotate(-3deg);transform-origin:left;margin-left:2px}
.slogan .sc small{display:block;font-family:var(--display);font-size:13px;letter-spacing:.06em;color:var(--plum);transform:none;margin-top:6px;font-weight:600}
.slogan p{margin:0;font-size:13px;color:var(--muted);max-width:58%}
.slogan .trio{position:absolute;right:-8px;bottom:-6px;width:150px;height:150px}
.slogan .trio i{position:absolute;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:var(--shadow);display:block}
.slogan .trio i svg{width:100%;height:100%}
.slogan .trio i:nth-child(1){width:92px;height:92px;right:20px;bottom:26px}
.slogan .trio i:nth-child(2){width:62px;height:62px;right:96px;bottom:12px}
.slogan .trio i:nth-child(3){width:56px;height:56px;right:0;bottom:104px}
.slogan .cta{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--fg);color:#fff;font-weight:700;font-size:13px;padding:10px 14px;border-radius:13px;margin-top:4px}

/* Преимущества */
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.perk{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted);padding:12px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);line-height:1.3}
.perk i{width:32px;height:32px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.perk i svg{width:17px;height:17px}
.perk b{font-family:var(--display);font-size:13px;color:var(--fg);font-weight:600}

/* Чипы каталога */
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:8px 16px;scrollbar-width:none;position:sticky;top:calc(62px + env(safe-area-inset-top,0px));background:rgba(255,253,254,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip svg{width:14px;height:14px;color:var(--accent-2)}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px -8px rgba(170,90,200,.9)}
.chip[aria-pressed="true"] small,.chip[aria-pressed="true"] svg{color:inherit;opacity:.85}
.found{font-size:13px;color:var(--muted)}

/* Нижнее меню с центральной корзиной */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;z-index:30;
  background:rgba(255,255,255,.9);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px;align-items:end}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:7px 0 5px;border-radius:18px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:0;width:4px;height:4px;border-radius:2px;background:var(--accent)}
.nav .mid{padding-top:0}
.nav .mid .bub{width:56px;height:56px;margin-top:-26px;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 12px 22px -10px rgba(170,80,190,.9);border:4px solid #fff;position:relative}
.nav .mid[aria-current="page"]::after{display:none}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--warn);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums;border:2px solid #fff}
.badge.pop{animation:pop .4s}

/* Плашка корзины */
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:calc(100% - 40px);max-width:440px;z-index:29;
  display:flex;align-items:center;gap:10px;background:var(--fg);color:#fff;border-radius:18px;padding:10px 10px 10px 14px;box-shadow:var(--shadow);text-align:left}
.cartbar .ct{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.cartbar .ct small{font-size:11.5px;opacity:.7}
.cartbar .ct b{font-family:var(--display);font-weight:600;font-size:15px}
.cartbar .go{background:var(--grad);border-radius:13px;padding:9px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.wa{position:fixed;right:max(18px,calc(50% - 240px + 18px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:25;width:48px;height:48px;border-radius:17px;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(20,140,70,.6);transition:bottom .25s}
.wa svg{width:25px;height:25px}
body.bar-on .wa{bottom:calc(158px + env(safe-area-inset-bottom,0px))}

/* Карточка товара */
.sheet-bg{position:fixed;inset:0;background:rgba(90,60,120,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:96%;border-radius:30px 30px 0 0;overflow-y:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@keyframes up{from{transform:translateY(70px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

  const minis=a.savory?[["#d08a35","b"],["#e0a858","r"],["#c9852f","b"],["#e0a858","r"]]:[["#fbeef2","berry"],["#dbe6bd","rose"],["#5a3626","choc"],["#e6d8f6","blue"]];
  [[50,96],[83,96],[117,96],[150,96],[50,118],[83,118],[117,118],[150,118]].forEach(([x,y],i)=>{const m=minis[(i+(i>3?2:0))%4];
    if(a.savory){s+=m[1]==="b"?`<rect x="${x-13}" y="${y-9}" width="26" height="18" rx="8" fill="${m[0]}"/><rect x="${x-13}" y="${y-9}" width="26" height="18" rx="8" fill="url(#${u}ball)"/>`

      s+=`<g transform="translate(${x} ${y-7}) scale(.6) translate(${-x} ${-(y-7)})">${DEC[m[1]](x,y-7,u,"#fffaf2")}</g>`}});

function art(p,cls="",big=false){
  const a=p.a,u="g"+(++GID);let inner;

    case "cake":inner=big?plate(u,96,146,92,15)+cakeSVG(a,u,{cx:80,rx:56,ry:13,top:64,bot:128})+sliceSVG(a,u,124,104,52,40):plate(u)+cakeSVG(a,u);break;
    case "slab":inner=plate(u)+slabSVG(a,u);break;
    case "pie":inner=plate(u,100,128,92,20)+pieSVG(a,u);break;
    case "set":inner=`<ellipse cx="100" cy="142" rx="92" ry="10" fill="url(#${u}sh)"/>`+setSVG(a,u);break;
    case "baursak":case "buns":inner=plate(u,100,130,90,22)+bunsSVG(a,u,a.shape);break;
    case "borek":inner=plate(u,100,130,90,22)+borekSVG(a,u);break;

const LOADED=new Set();
function img(url,p,big,lazy){
  const ok=LOADED.has(url);
  return `<img class="photo${ok?" ok":""}" src="${esc(url)}" alt="${esc(p.n)}"${lazy&&!ok?' loading="lazy"':""} referrerpolicy="no-referrer" onload="imgOk(this)" onerror="imgFail(this,${p.id},${big?1:0})">`;
}
function vis(p,cls="",big=false){
  const f=p.photo;
  if(!f)return art(p,cls,big);
  // в большой карточке сразу показываем уже загруженную миниатюру, поверх догружается полное фото
  return `<span class="skel"></span>`+(big?img(f[0],p,big,false)+img(f[1],p,big,false):img(f[0],p,big,true));
}
function imgOk(el){LOADED.add(el.getAttribute("src"));el.classList.add("ok")}
function imgFail(el,id,big){
  const box=el.parentNode;el.remove();
  if(box&&!box.querySelector("img.photo")&&!box.querySelector("svg.fb")){const p=byId(id);box.insertAdjacentHTML("beforeend",art(p,"fb",!!big));box.querySelector(".skel")?.remove()}
}

function cartCount(){return S.cart.reduce((s,l)=>s+l.q,0)}
function inCart(id){return S.cart.filter(l=>l.id===id).reduce((s,l)=>s+l.q,0)}
function addToCart(id,vi,q=1){
  const ex=S.cart.find(l=>l.id===id&&l.vi===vi);
  if(ex)ex.q+=q;else S.cart.push({id,vi,q});
  save();toast("Добавлено в корзину");renderNav(true);
}
function setQty(i,d){S.cart[i].q+=d;if(S.cart[i].q<=0)S.cart.splice(i,1);save();renderNav();renderView()}
function bump(id,d){const i=S.cart.findIndex(l=>l.id===id&&l.vi===0);if(i<0){if(d>0)addToCart(id,0);}else{S.cart[i].q+=d;if(S.cart[i].q<=0)S.cart.splice(i,1);save();renderNav(d>0)}keepScroll(renderView)}
function totals(){
  let sub=0,cakes=0;
  S.cart.forEach(l=>{const p=byId(l.id),x=p.v[l.vi][1]*l.q;sub+=x;if(p.c==="cakes")cakes+=x});
  const lv=level(USER.spent);let disc,label;
  // Скидка имениннику −10 % на торты, на остальное — накопительная; не суммируются
  if(S.co.bday&&cakes){disc=Math.round(cakes*.10+(sub-cakes)*lv.p/100);label="Имениннику −10 % на торты"}
  else{disc=Math.round(sub*lv.p/100);label=`Накопительная скидка ${lv.p} %`}
  const delivery=S.co.mode==="delivery"?(sub>=15000?0:1500):0;
  return{sub,disc,label,delivery,total:sub-disc+delivery,cakes};
}

  let hold=false;sl.addEventListener("touchstart",()=>hold=true,{passive:true});sl.addEventListener("touchend",()=>setTimeout(()=>hold=false,4000),{passive:true});
  clearInterval(slideTimer);

document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-open],[data-close],#cartbar");if(!el)return;
  const ds=el.dataset;
  if(el.id==="cartbar"){S.tab="cart";S.screen=null;return render()}
  if(ds.sclose!==undefined)return closeStory();
  if(ds.snav)return stepStory(+ds.snav);
  if(ds.sgo!==undefined){const s=STORIES[story.i];closeStory();if(s.act==="open")return openProduct(byName(s.p).id);S.tab="catalog";S.cat=s.cat;S.q="";return render()}
  if(ds.story)return openStory(+ds.story);
  if(ds.fav){e.stopPropagation();toggleFav(+ds.fav);renderTop();if(sheet)drawSheet();return keepScroll(renderView)}
  if(ds.close!==undefined&&(e.target===el||el.classList.contains("close"))){sheet=null;return drawSheet()}
  if(ds.bump){e.stopPropagation();return bump(+ds.bump,+ds.d)}
  if(ds.quick){e.stopPropagation();const p=byId(+ds.quick);if(p.v.length>1)return openProduct(p.id);addToCart(p.id,0);return keepScroll(renderView)}
  if(ds.open)return openProduct(+ds.open);
  if(ds.more!==undefined){$("#desc").classList.add("open");el.remove();return}
  if(ds.vi){sheet.vi=+ds.vi;return drawSheet()}
  if(ds.sq){sheet.q=Math.max(1,sheet.q+ +ds.sq);return drawSheet()}
  if(ds.addsheet!==undefined){addToCart(sheet.id,sheet.vi,sheet.q);sheet=null;drawSheet();return keepScroll(renderView)}
  if(ds.tab){sheet=null;drawSheet();S.tab=ds.tab;S.screen=null;S.q="";return render()}
  if(ds.goCat){S.tab="catalog";S.cat=ds.goCat;S.q="";S.screen=null;return render()}
  if(ds.cat){S.cat=ds.cat;return renderView()}
  if(ds.q!==undefined&&ds.d)return setQty(+ds.q,+ds.d);
  if(ds.checkout!==undefined){S.screen="checkout";return render()}
  if(ds.act==="back"){S.tab=S.screen==="done"?"home":"cart";S.screen=null;return render()}
  if(ds.mode){S.co.mode=ds.mode;return keepScroll(renderView)}
  if(ds.branch){S.co.branch=+ds.branch;return keepScroll(renderView)}
  if(ds.day){S.co.day=+ds.day;return keepScroll(renderView)}
  if(ds.slot){S.co.slot=+ds.slot;return keepScroll(renderView)}
  if(ds.pay){S.co.pay=ds.pay;return keepScroll(renderView)}
  if(ds.place!==undefined)return placeOrder();
  if(ds.pickup){S.co.mode="pickup";S.co.branch=+ds.pickup;toast("Кондитерская выбрана");if(S.cart.length)S.screen="checkout";else S.tab="catalog";return render()}
  if(ds.copy){const v=ds.copy;try{navigator.clipboard.writeText(v).then(()=>toast("Номер скопирован"),()=>toast(v))}catch(err){toast(v)}}
});

  }
});
document.addEventListener("change",e=>{if(e.target.dataset.bday!==undefined){S.co.bday=e.target.checked;renderView()}});
render();
</script>
