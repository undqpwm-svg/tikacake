<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b55c8">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Tika Cake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Витрина кондитерской: товар на пастельной «подложке», много воздуха, плавающее меню. Сиреневая гамма tikacake.kz. */
:root{
  --bg:#fcfaff; --card:#ffffff; --soft:#f4eefb; --line:#ebe3f5;
  --fg:#261d30; --muted:#857a91; --accent:#8b55c8; --accent-ink:#ffffff; --accent-soft:#f0e6fb; --plum:#4f2878;
  --ok:#2b8a5a; --warn:#d0532e; --wa:#25d366;
  --t-lilac:#efe6fb; --t-pink:#fce9ef; --t-peach:#fdeedf; --t-mint:#ecf3e1; --t-cream:#f9f1e2; --t-choc:#f3e8e1;
  --glass:rgba(255,255,255,.86); --shadow:0 10px 30px -10px rgba(79,40,120,.28); --shadow-s:0 2px 10px rgba(79,40,120,.08);
  --display:"Unbounded","Montserrat",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font:"Montserrat",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141018; --card:#1d1723; --soft:#251d2e; --line:#33293e;
  --fg:#f3eef8; --muted:#a99db6; --accent:#b98ff0; --accent-ink:#1a1222; --accent-soft:#2f2440; --plum:#dcc4fa;
  --ok:#5cc28c; --warn:#ff8a5c;
  --t-lilac:#2a2138; --t-pink:#33212b; --t-peach:#33271f; --t-mint:#232c1f; --t-cream:#2f2a20; --t-choc:#2e2420;
  --glass:rgba(29,23,35,.86); --shadow:0 10px 30px -10px rgba(0,0,0,.6); --shadow-s:0 2px 10px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141018; --card:#1d1723; --soft:#251d2e; --line:#33293e;
  --fg:#f3eef8; --muted:#a99db6; --accent:#b98ff0; --accent-ink:#1a1222; --accent-soft:#2f2440; --plum:#dcc4fa;
  --ok:#5cc28c; --warn:#ff8a5c;
  --t-lilac:#2a2138; --t-pink:#33212b; --t-peach:#33271f; --t-mint:#232c1f; --t-cream:#2f2a20; --t-choc:#2e2420;
  --glass:rgba(29,23,35,.86); --shadow:0 10px 30px -10px rgba(0,0,0,.6); --shadow-s:0 2px 10px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){.app{border-inline:1px solid var(--line)}}
.t-lilac{background:var(--t-lilac)}.t-pink{background:var(--t-pink)}.t-peach{background:var(--t-peach)}
.t-mint{background:var(--t-mint)}.t-cream{background:var(--t-cream)}.t-choc{background:var(--t-choc)}

/* Шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;color:var(--plum)}
.brand span{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.top h1{font-family:var(--display);font-size:17px;margin:0;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow-s);flex:none}
.iconbtn svg{width:20px;height:20px}
.spacer{flex:1}
.proto{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-soft);background:var(--card);padding:5px 9px;border-radius:99px}

main{flex:1;padding:6px 16px 120px;display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-family:var(--display);font-size:17px;margin:0;font-weight:600;text-wrap:balance}
.sec-h button{color:var(--accent);font-weight:600;font-size:13px}

/* Поиск */
.search{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow-s);border-radius:16px;padding:0 14px;height:50px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.search input::placeholder{color:var(--muted)}
.search svg{width:19px;height:19px;color:var(--accent);flex:none}

/* Торт недели */
.hero{border-radius:28px;padding:22px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr) 46%;gap:6px;align-items:center;position:relative;overflow:hidden;text-align:left;width:100%}
.hero::before{content:"";position:absolute;right:-60px;top:-50px;width:240px;height:240px;border-radius:50%;background:var(--card);opacity:.55}
.hero > *{position:relative}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.hero h2{font-family:var(--display);font-size:22px;line-height:1.12;margin:8px 0 8px;font-weight:700;color:var(--plum);text-wrap:balance}
.hero p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.hero .art{width:100%;display:block;aspect-ratio:200/170}
.hero .cta{display:inline-flex;align-items:center;gap:8px;background:var(--plum);color:var(--bg);font-weight:700;font-size:14px;padding:11px 16px;border-radius:14px}

/* Акции */
.promos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.promo{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);box-shadow:var(--shadow-s)}
.promo b{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent);line-height:1.1}
.promo span{font-size:12.5px;color:var(--muted);line-height:1.35}

/* Категории */
.cats{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600}
.cat i{width:76px;height:76px;border-radius:24px;display:grid;place-items:center}
.cat i svg{width:66px;height:56px}

/* Карточки */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.pic{aspect-ratio:1/1.02;border-radius:24px;display:grid;place-items:center;position:relative;max-width:100%;overflow:hidden}
.pic svg{width:96%;height:auto}
.tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:9px;background:var(--card);color:var(--accent);box-shadow:var(--shadow-s)}
.card .nm{font-weight:600;font-size:14.5px;line-height:1.25;padding-inline:2px}
.card .wt{font-size:12px;color:var(--muted);padding-inline:2px;margin-top:-6px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-inline:2px}
.price{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.price .from{font-family:var(--font);font-weight:500;color:var(--muted);font-size:12px}
.add{width:38px;height:38px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -6px var(--accent)}
.add svg{width:18px;height:18px}
.add.in{background:var(--accent-soft);color:var(--accent);box-shadow:none;width:auto;padding:0 12px;font-weight:700;font-size:13px}

/* Чипы */
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:8px 16px;scrollbar-width:none;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));background:var(--bg);z-index:10}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow-s);font-weight:600;font-size:13px;white-space:nowrap}
.chip small{color:var(--muted);font-weight:500;margin-left:5px}
.chip[aria-pressed="true"]{background:var(--plum);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

/* Плавающее меню */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;z-index:30;
  background:var(--glass);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:7px 0 6px;border-radius:18px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;left:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}

.wa{position:fixed;right:max(18px,calc(50% - 240px + 18px));bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:25;width:46px;height:46px;border-radius:16px;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(20,140,70,.6)}
.wa svg{width:24px;height:24px}

/* Шторка товара */
.sheet-bg{position:fixed;inset:0;background:rgba(25,12,40,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:94%;border-radius:30px 30px 0 0;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .ph{position:relative;display:grid;place-items:center;padding:30px 10px 6px;border-radius:30px 30px 0 0}
.sheet .ph svg{width:92%;height:auto;max-width:380px}
.sheet .close{position:absolute;top:14px;right:14px}
.sheet .grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:42px;height:4px;border-radius:2px;background:var(--fg);opacity:.15}
.sheet .in{padding:18px 18px 4px;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--display);margin:0;font-size:22px;line-height:1.15;font-weight:700;text-wrap:balance}
.sheet p{margin:0;color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt span{font-size:12px;color:var(--muted)}
.opt b{font-family:var(--display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;font-size:11.5px;color:var(--muted)}
.fact b{display:block;color:var(--fg);font-size:13px}
.note{background:var(--accent-soft);border-radius:14px;padding:11px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.note svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:1px}
.buybar{display:flex;gap:10px;align-items:center;position:sticky;bottom:0;background:var(--bg);padding-block:10px 4px}
.qty{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;height:54px}
.qty button{width:44px;height:100%;font-size:20px;font-weight:600}
.qty span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.btn{height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;box-shadow:0 10px 22px -10px var(--accent);text-decoration:none}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:var(--shadow-s)}
.btn.wa-btn{background:var(--wa);color:#07361b;box-shadow:none}

/* Корзина */
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:8px 12px 8px 8px;box-shadow:var(--shadow-s)}
.line .th{width:76px;height:76px;border-radius:16px;display:grid;place-items:center;overflow:hidden}
.line .th svg{width:100%;height:auto}
.line .nm{font-weight:600;font-size:14px}
.line .var{font-size:12px;color:var(--muted)}
.line .qty{height:34px;border-radius:11px;margin-top:6px;width:max-content;background:var(--soft);border:0}
.line .qty button{width:32px;font-size:17px}
.sum{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:9px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-s)}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-family:var(--display);font-size:17px;font-weight:700;padding-top:10px;border-top:1px dashed var(--line)}
.sum .disc{color:var(--ok)}
.empty{text-align:center;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .pic{width:200px}
.empty h2{font-family:var(--display);color:var(--fg);margin:6px 0 0;font-size:18px;font-weight:600}
.empty p{margin:0 0 6px}

/* Формы */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:16px;padding:4px}
.seg button{height:44px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow-s);color:var(--plum)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;width:100%;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{height:80px;padding:12px 14px;resize:none}
.field .hint{font-size:12px;color:var(--muted)}
.field.err input{border-color:var(--warn)}
.field .msg{font-size:12px;color:var(--warn)}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.radio[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.radio[aria-pressed="true"] .dot{border-color:var(--accent)}
.radio[aria-pressed="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.radio .t{flex:1;min-width:0}
.radio .t b{display:block;font-size:14px}
.radio .t span{font-size:12px;color:var(--muted)}
.slots{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.slots::-webkit-scrollbar{display:none}
.slot{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 13px;font-size:13px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.slot span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow-s)}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}

/* Бонусы */
.loyal{border-radius:26px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#b48ae6 0%,#7a45b8 45%,#4a2373 100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.loyal::after{content:"TIKA CAKE";position:absolute;right:-6px;bottom:-12px;font-family:var(--display);font-weight:700;font-size:38px;opacity:.09;letter-spacing:.02em;white-space:nowrap}
.loyal .lv{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.loyal .pct{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.loyal .bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.loyal .bar i{display:block;height:100%;background:#fff;border-radius:4px}
.loyal small{opacity:.9;font-size:12px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.level{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.level b{font-family:var(--display);font-size:19px;font-weight:600;color:var(--fg)}
.level.cur{border-color:var(--accent);background:var(--accent-soft)}
.hist{background:var(--card);border-radius:20px;padding:4px 16px;box-shadow:var(--shadow-s)}
.hist div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
.hist span{color:var(--muted);font-size:12px;grid-column:1/-1}
.hist b{font-variant-numeric:tabular-nums;text-align:right}

/* Филиалы */
.contact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.contact a,.contact button{border-radius:20px;padding:14px;background:var(--card);box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--fg);text-align:left}
.contact span{font-size:12px;color:var(--muted)}
.contact b{font-size:14px;word-break:break-word}
.contact .wa-c{background:var(--wa);color:#07361b}.contact .wa-c span{color:#0b4a26}
.branches{display:flex;flex-direction:column;gap:10px}
.branch{background:var(--card);border-radius:20px;padding:14px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;box-shadow:var(--shadow-s)}
.branch .ic{grid-row:span 3;width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.branch .ic svg{width:20px;height:20px}
.branch .a{font-weight:700}
.branch .d{font-size:12px;color:var(--muted)}
.branch .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:13px;font-weight:600;padding:8px 12px;border-radius:11px;background:var(--soft);text-decoration:none;color:var(--fg)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:16px}
.done .ok{width:88px;height:88px;border-radius:30px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.done .ok svg{width:44px;height:44px}
.done h2{font-family:var(--display);margin:0;font-size:20px;font-weight:700}

// Круглый торт: цилиндр + верх + подтёки + декор

  s+=`<ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${ry}" fill="url(#${u}hl)"/>`;
  if(a.pist){for(let i=0;i<40;i++){const t=R0()*Math.PI*2,r=Math.sqrt(R0())*.55;s+=`<circle cx="${f1(cx+Math.cos(t)*rx*r)}" cy="${f1(top+Math.sin(t)*ry*r)}" r="${f1(.8+R0()*1.2)}" fill="${R0()>.5?"#8fae4a":"#b9d07a"}"/>`}}

function cartCount(){return S.cart.reduce((s,l)=>s+l.q,0)}
function addToCart(id,vi,q=1){
  const ex=S.cart.find(l=>l.id===id&&l.vi===vi);
  if(ex)ex.q+=q;else S.cart.push({id,vi,q});
  save();toast("Добавлено в корзину");renderNav();
}
function setQty(i,d){S.cart[i].q+=d;if(S.cart[i].q<=0)S.cart.splice(i,1);save();renderNav();renderView()}
function totals(){
  let sub=0,cakes=0;
  S.cart.forEach(l=>{const p=byId(l.id),x=p.v[l.vi][1]*l.q;sub+=x;if(p.c==="cakes")cakes+=x});
  const lv=level(USER.spent);let disc,label;
  // Скидка имениннику −10 % на торты, на остальное — накопительная; не суммируются
  if(S.co.bday&&cakes){disc=Math.round(cakes*.10+(sub-cakes)*lv.p/100);label="Имениннику −10 % на торты"}
  else{disc=Math.round(sub*lv.p/100);label=`Накопительная скидка ${lv.p} %`}
  const delivery=S.co.mode==="delivery"?(sub>=15000?0:1500):0;
  return{sub,disc,label,delivery,total:sub-disc+delivery,cakes};
}

function placeOrder(){
  const c=S.co;let bad=null;
  const mark=(id,ok,msg)=>{const f=$("#"+id);if(!f)return;f.classList.toggle("err",!ok);f.querySelector(".msg")?.remove();if(!ok){f.insertAdjacentHTML("beforeend",`<span class="msg">${msg}</span>`);bad=bad||f}};
  mark("f-name",c.name.trim().length>1,"Укажите имя");
  mark("f-phone",c.phone.replace(/\D/g,"").length>=11,"Введите номер в формате +7 7XX XXX XX XX");
  if(c.mode==="delivery")mark("f-addr",c.addr.trim().length>4,"Укажите улицу и дом");
  if(bad){bad.scrollIntoView({behavior:"smooth",block:"center"});return}
  const t=totals(),d=days()[c.day];
  S.orders.unshift({no:String(Math.floor(10000+Math.random()*89999)),date:d[1],total:t.total,pay:c.pay,
    where:c.mode==="pickup"?"Самовывоз: "+BRANCHES[c.branch][0]:"Доставка: "+c.addr,
    when:`${d[0].toLowerCase()} ${d[1]}, ${SLOTS[c.slot]}`,
    items:S.cart.map(l=>{const p=byId(l.id);return `${p.n} (${p.v[l.vi][0]}) × ${l.q}`})});
  S.cart=[];save();S.screen="done";render();
}

  const ds=el.dataset;
  if(ds.close!==undefined&&(e.target===el||el.classList.contains("close"))){sheet=null;return drawSheet()}
  if(ds.quick){e.stopPropagation();const p=byId(+ds.quick);if(p.v.length>1)return openProduct(p.id);addToCart(p.id,0);return renderView()}
  if(ds.open)return openProduct(+ds.open);
  if(ds.vi){sheet.vi=+ds.vi;return drawSheet()}
  if(ds.sq){sheet.q=Math.max(1,sheet.q+ +ds.sq);return drawSheet()}
  if(ds.addsheet!==undefined){addToCart(sheet.id,sheet.vi,sheet.q);sheet=null;drawSheet();return renderView()}
  if(ds.tab){sheet=null;drawSheet();S.tab=ds.tab;S.screen=null;S.q="";return render()}
  if(ds.goCat){S.tab="catalog";S.cat=ds.goCat;S.q="";S.screen=null;return render()}
  if(ds.cat){S.cat=ds.cat;return renderView()}
  if(ds.q!==undefined&&ds.d)return setQty(+ds.q,+ds.d);
  if(ds.checkout!==undefined){S.screen="checkout";return render()}
  if(ds.act==="back"){S.tab=S.screen==="done"?"home":"cart";S.screen=null;return render()}
  if(ds.mode){S.co.mode=ds.mode;return renderView()}
  if(ds.branch){S.co.branch=+ds.branch;return renderView()}
  if(ds.day){S.co.day=+ds.day;return renderView()}
  if(ds.slot){S.co.slot=+ds.slot;return renderView()}
  if(ds.pay){S.co.pay=ds.pay;return renderView()}
  if(ds.place!==undefined)return placeOrder();
  if(ds.pickup){S.co.mode="pickup";S.co.branch=+ds.pickup;toast("Кондитерская выбрана");if(S.cart.length)S.screen="checkout";else S.tab="catalog";return render()}
  if(ds.copy){const v=ds.copy;try{navigator.clipboard.writeText(v).then(()=>toast("Номер скопирован"),()=>toast(v))}catch(err){toast(v)}}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet){sheet=null;drawSheet()}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches?.("div[data-open]")){e.preventDefault();openProduct(+e.target.dataset.open)}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f!==undefined){S.co[t.dataset.f]=t.value;t.closest(".field")?.classList.remove("err");t.closest(".field")?.querySelector(".msg")?.remove()}
  if(t.dataset.search!==undefined){
    S.q=t.value;
    if(S.tab!=="catalog"){S.tab="catalog";render()}else renderView();
    const i=$("#q-cat");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  }
});
document.addEventListener("change",e=>{if(e.target.dataset.bday!==undefined){S.co.bday=e.target.checked;renderView()}});
render();
loadPhotos();
</script>
</body>
</html>
